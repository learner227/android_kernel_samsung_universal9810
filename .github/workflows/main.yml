name: Build N960N Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install old GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential gcc-9 g++-9 libncurses5-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 9
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 9

      - name: Get Android 4.9 toolchain
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Fix dtc bug
        run: |
          # fix multiple definition of yylloc for new gcc
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-parser.tab.c_shipped || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-parser.tab.h_shipped || true

      - name: Build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CFLAGS="-fcommon"
          export HOSTCFLAGS="-fcommon"
          make exynos9810-crownlte_defconfig
          make olddefconfig
          make -j$(nproc) Image

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: N960N-Kernel-Image
          path: arch/arm64/boot/Image
