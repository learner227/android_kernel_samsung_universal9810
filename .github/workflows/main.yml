name: Build N960N Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential gcc-aarch64-linux-gnu libncurses-dev

      - name: Prepare config
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Use original defconfig only, no extra config edits
          if [ -f arch/arm64/configs/exynos9810-crownlte_defconfig ]; then
            make exynos9810-crownlte_defconfig
          else
            ls arch/arm64/configs/ | head -n 20
            make crownlte_defconfig || make exynos9810_defconfig
          fi
          # Auto fill new options with defaults (fixes your error)
          yes "" | make oldconfig
          make olddefconfig

      - name: Build Image
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) Image
          ls -lh arch/arm64/boot/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: N960N-Kernel-Image
          path: arch/arm64/boot/Image
