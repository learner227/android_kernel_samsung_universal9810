name: Build N960N DTK1
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev
      - name: toolchain
        run: git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth 1 toolchain
      - name: build kernel
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          make exynos9810-crownlte_defconfig
          make -j$(nproc) Image dtb.img
      - name: AnyKernel zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth 1 AK
          cp arch/arm64/boot/Image AK/
          cp arch/arm64/boot/dtb.img AK/ 2>/dev/null || cp arch/arm64/boot/dtb AK/
          cd AK && zip -r9 ../N960N-DTK1-StockReady.zip * -x .git README.md *placeholder
      - uses: actions/upload-artifact@v4
        with:
          name: N960N-DTK1-Kernel
          path: N960N-DTK1-StockReady.zip